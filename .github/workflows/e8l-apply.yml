name: E8L Apply Modal Asset Insertion
on:
  push:
    branches:
      - codex/v8z4b32E8L-insercao-modal-ativos
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped E8L patch
        run: |
          base64 -d .e8l_patch.b64 | gzip -d > /tmp/apply_e8l.py
          python /tmp/apply_e8l.py
      - name: Validate syntax and guardrails
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
          Path('/tmp/arco-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/arco-inline.js
          node scripts/qa/check-ui-leakage.mjs
          node scripts/qa/check-project-os.mjs
          node scripts/qa/check-markdown-links.mjs
          node scripts/qa/check-asset-transform-handles.mjs
      - name: Remove temporary patch machinery and commit
        run: |
          rm -f .e8l_patch.b64 .github/workflows/e8l-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "v8z4b32E8L fix assets modal sequential insertion"
          git push
