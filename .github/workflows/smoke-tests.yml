name: WebKit Smoke Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  webkit-smoke-tests:
    name: WebKit smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Run WebKit smoke tests
        run: npx playwright test --retries=0

      - name: Run E8X scenario E without artifacts
        if: always()
        env:
          E8X_DIAG_NO_ARTIFACTS: '1'
        run: npx playwright test tests/smoke/app.spec.mjs --project=webkit-mobile-smoke --grep "E8X-DIAG E —" --workers=1 --retries=0

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-smoke-evidence
          if-no-files-found: warn
          path: |
            test-results/**/arco-motion-initial-render.png
            playwright-report/**
            test-results/**
