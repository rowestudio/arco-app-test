name: Browser Smoke Tests

on:
  pull_request:
    branches: [main]
    # Conservative non-runtime allowlist. Browser Smoke is skipped only when EVERY
    # changed file is unambiguously documentation, project policy, or agent
    # instructions. GitHub skips a workflow only when ALL changed paths match
    # paths-ignore, so any runtime file (index.html, assets, package/lock,
    # playwright config, tests/**, .github/workflows/**, scripts/**, or an
    # unrecognized path) keeps the suite applicable. This mirrors
    # isWebKitSuiteApplicable() in scripts/ci/mobile-ci-watchdog.mjs.
    paths-ignore:
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
      - '**/*.md'
      - '*.md'
  workflow_dispatch:

# A new commit on a PR supersedes the previous commit's Browser Smoke run: checks are
# per-SHA, so the old-SHA run can never validate the new HEAD. Cancelling it also frees
# the runner if a WebKit install hung on the superseded commit. The group is keyed per
# PR (or ref), so distinct PRs never cancel each other.
concurrency:
  group: browser-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  webkit-smoke-tests:
    name: WebKit Smoke Tests
    runs-on: ubuntu-24.04
    # Bounded execution for WebKit/Linux so a hung install/download can never leave a
    # PR pending for hours. Normal runs (npm ci + WebKit install + functional smoke)
    # complete in a handful of minutes; 25 minutes is comfortably above that while
    # remaining tens-of-minutes, not hours. The macOS export job uses its own 20m cap.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Portable coreutils `timeout` bounds the WebKit install specifically. On a hang
      # it exits 124 (non-zero), so the step FAILS with a real diagnostic — a bounded
      # install never turns an error into a PASS. Exit status is preserved and there is
      # no retry loop.
      - name: Install Playwright WebKit (bounded)
        run: timeout 12m npx playwright install --with-deps webkit
      - name: Run WebKit functional smoke through Preview
        run: npx playwright test --project=webkit-mobile-smoke --workers=1 --retries=0
      - name: Upload WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-functional-evidence
          if-no-files-found: warn
          path: |
            playwright-report/**
            test-results/**

  webkit-macos-real-export:
    name: Real Export Smoke (WebKit macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - name: Log WebKit macOS export environment
        run: |
          sw_vers
          uname -m
          npx playwright --version
          npx playwright install --dry-run webkit
          echo "MERGE_SHA=$GITHUB_SHA"
          echo "PR_HEAD_SHA=${{ github.event.pull_request.head.sha }}"
      - name: Run real H.264 Export smoke
        run: npx playwright test tests/smoke/export.spec.mjs --project=webkit-macos-export --workers=1 --retries=0
      - name: Write WebKit macOS Export evidence manifest
        if: always()
        run: |
          mkdir -p test-results/export-evidence
          printf '{"workflow":"Real Export Smoke (WebKit macOS)","sha":"%s","ref":"%s","runner":"%s","attempt":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REF" "$RUNNER_OS" "$GITHUB_RUN_ATTEMPT" > test-results/export-evidence/manifest.json
      - name: Upload WebKit macOS Export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-macos-real-export-evidence
          if-no-files-found: error
          path: |
            playwright-report/**
            test-results/**
