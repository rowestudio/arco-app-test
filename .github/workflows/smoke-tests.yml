name: Browser Smoke Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  webkit-smoke-tests:
    name: WebKit Smoke Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Run WebKit functional smoke through Preview
        run: npx playwright test --project=webkit-mobile-smoke --workers=1 --retries=0
      - name: Upload WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-functional-evidence
          if-no-files-found: warn
          path: |
            playwright-report/**
            test-results/**

  chrome-real-export:
    name: Real Export Smoke (Chrome)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Log Chrome export environment
        run: |
          google-chrome --version
          npx playwright --version
          uname -a
          echo "SHA=$GITHUB_SHA"
      - name: Run real H.264 Export smoke
        run: npx playwright test --project=chrome-export --workers=1 --retries=0
      - name: Upload Chrome Export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-real-export-evidence
          if-no-files-found: error
          path: |
            playwright-report/**
            test-results/**
